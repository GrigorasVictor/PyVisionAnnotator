http:
  routers:
    auth-router:
      entryPoints:
        - web
      rule: PathPrefix(`/auth`)
      service: auth-service

    chat-router:
      entryPoints:
        - web
      rule: PathPrefix(`/chat`) || PathPrefix(`/notifications`) || PathPrefix(`/ws`) || PathPrefix(`/monitor`)
      middlewares:
        - auth-forward
      service: chat-service

    annotation-router:
      entryPoints:
        - web
      rule: PathPrefix(`/annotation`)
      middlewares:
        - auth-forward
        - annotation-strip-prefix
      service: annotation-service

  middlewares:
    auth-forward:
      forwardAuth:
        address: "http://auth-service:8080/auth/validate"
        trustForwardHeader: true
        authResponseHeaders:
          - X-User-Id

    annotation-strip-prefix:
      stripPrefix:
        prefixes:
          - /annotation
        forceSlash: false

  services:
    auth-service:
      loadBalancer:
        servers:
          - url: "http://auth-service:8080"

    chat-service:
      loadBalancer:
        servers:
          - url: "http://chat-service:8084"

    annotation-service:
      loadBalancer:
        servers:
          - url: "http://annotation-service:8085"

