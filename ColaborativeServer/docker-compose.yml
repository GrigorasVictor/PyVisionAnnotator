services:
  reverse-proxy:
    image: traefik:v3.1
    container_name: reverse-proxy
    command:
      - --configFile=/etc/traefik/traefik.yml
    ports:
      - "80:80"
      - "8081:8080"
    volumes:
      - ./reverse_proxy/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./reverse_proxy/dynamic.yml:/etc/traefik/dynamic.yml:ro
    depends_on:
      - auth-service
      - chat-service
      - annotation-service
    networks:
      - server-network
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3-management
    container_name: queue-service
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      - server-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  postgres-auth:
    image: postgres:15
    container_name: auth-db
    environment:
      POSTGRES_DB: auth_db
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres-auth-data:/var/lib/postgresql/data
      - ./auth_module/db/init:/docker-entrypoint-initdb.d
    networks:
      - server-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d auth_db"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  auth-service:
    container_name: auth-service
    build:
      context: auth_module
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      SERVER_PORT: ${AUTH_SERVICE_PORT}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-auth:5432/auth_db?currentSchema=credential_db
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_SHOW_SQL: "false"
      SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT: org.hibernate.dialect.PostgreSQLDialect
      SPRING_JPA_PROPERTIES_HIBERNATE_DEFAULT_SCHEMA: credential_db
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
    expose:
      - "8080"
    depends_on:
      postgres-auth:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - server-network
    restart: unless-stopped

  chat-service:
    container_name: chat-service
    build:
      context: chat_module
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      SERVER_PORT: 8084
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
    expose:
      - "8084"
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - server-network
    restart: unless-stopped

  annotation-service:
    container_name: annotation-service
    build:
      context: annotation_module
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      SERVER_PORT: 8085
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
    expose:
      - "8085"
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - server-network
    restart: unless-stopped

volumes:
  postgres-auth-data:
  rabbitmq-data:

networks:
  server-network:
    driver: bridge
