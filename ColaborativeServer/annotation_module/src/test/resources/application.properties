# Test configuration
spring.application.name=annotation_service-test
server.port=0

# Database Configuration for Testing
spring.datasource.url=jdbc:h2:mem:annotation_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# JPA Configuration for Testing
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop

# JWT Configuration - Base64 encoded test secret
jwt.secret=dGVzdFNlY3JldEZvckFubm90YXRpb25TZXJ2aWNlVGVzdDEyMzQ1Njc4OTA=

# RabbitMQ Configuration (unused in tests)
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest
